<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <rect width="1200" height="630" fill="#09090B"/>
  <circle cx="950" cy="150" r="300" fill="#22C55E" opacity="0.15" filter="blur(80px)"/>
  <circle cx="200" cy="500" r="250" fill="#3B82F6" opacity="0.12" filter="blur(80px)"/>

  <!-- Card container -->
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="#18181B" stroke="#27272A" stroke-width="2"/>

  <!-- Brand header -->
  <rect x="130" y="130" width="64" height="64" rx="16" fill="#22C55E"/>
  <text x="162" y="174" fill="white" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="36" text-anchor="middle">A</text>
  <text x="214" y="172" fill="white" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="32" letter-spacing="-0.02em">ARTO</text>
  <text x="306" y="171" fill="#71717A" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="20">|</text>
  <text x="330" y="171" fill="#22C55E" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="18">Ngerti artone, ngerti uripe</text>

  <!-- Main Headline -->
  <text x="130" y="275" fill="white" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="52" letter-spacing="-0.03em">
    Kelola uang lebih bijak,
  </text>
  <text x="130" y="340" fill="#22C55E" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="52" letter-spacing="-0.03em">
    tanpa bikin pusing.
  </text>

  <!-- Subtitle -->
  <text x="130" y="410" fill="#A1A1AA" font-family="Plus Jakarta Sans, sans-serif" font-weight="500" font-size="22">
    Pencatatan transaksi, multi-dompet, dan batas pengeluaran harian dinamis.
  </text>

  <!-- Badge pill -->
  <rect x="130" y="460" width="220" height="44" rx="22" fill="#22C55E" fill-opacity="0.1" stroke="#22C55E" stroke-opacity="0.3"/>
  <circle cx="152" cy="482" r="6" fill="#22C55E"/>
  <text x="172" y="489" fill="#22C55E" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="15">100% Gratis &amp; Aman</text>
</svg>
